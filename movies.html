<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Start Page – Movies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Page background */
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #dcdcdc;
    }

    /* The "document" */
    .page {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px 20px 32px;
      box-shadow: 0 0 6px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 1.1rem;
      margin: 22px 0 8px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    li {
      margin: 4px 0;
    }

    a {
      text-decoration: none;
      color: #0056b3;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }

    /* Back link */
    .back {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 12px 0 24px;
    }

    /* Small screens */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .page {
        padding: 18px 14px 24px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">


    
    <h1>The Start Page – Movies and Series</h1>
    <div class="subtitle">Movies and Series</div>


    <!-- Back (top) -->

</html>
